name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Detect Android Project Structure
        id: detect-project
        run: |
          # Search for gradlew to identify the project root
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Gradle wrapper (gradlew) could not be found in the repository!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          # Clean path if it is "./"
          if [ "$PROJECT_ROOT" = "." ]; then
            PROJECT_ROOT=$(pwd)
          else
            PROJECT_ROOT=$(pwd)/${PROJECT_ROOT#./}
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Detected Project Root: $PROJECT_ROOT"

          # Search for the application module inside the project root
          # Look for build.gradle or build.gradle.kts that applies com.android.application
          APP_MODULE=""
          for file in $(find "$PROJECT_ROOT" -name "build.gradle" -o -name "build.gradle.kts"); do
            if grep -q "com.android.application" "$file" 2>/dev/null; then
              # The directory containing this file is the application module
              APP_MODULE_DIR=$(dirname "$file")
              APP_MODULE=$(basename "$APP_MODULE_DIR")
              break
            fi
          done

          if [ -z "$APP_MODULE" ]; then
            echo "::error::Could not find an application module with the 'com.android.application' plugin!"
            exit 1
          fi
          echo "APP_MODULE=$APP_MODULE" >> $GITHUB_ENV
          echo "Detected Application Module: $APP_MODULE"

      - name: Clean Stale Gradle and Build Caches
        run: |
          echo "Removing stale Gradle and build caches..."
          # Only delete safe-to-recreate folders as specified
          if [ -d "${{ env.PROJECT_ROOT }}/.gradle" ]; then
            rm -rf "${{ env.PROJECT_ROOT }}/.gradle"
          fi
          if [ -d "${{ env.PROJECT_ROOT }}/${{ env.APP_MODULE }}/build" ]; then
            rm -rf "${{ env.PROJECT_ROOT }}/${{ env.APP_MODULE }}/build"
          fi

      - name: Check and Generate Debug Keystore
        run: |
          # In app/build.gradle.kts, the debug signing config looks for ${rootDir}/debug.keystore
          KEYSTORE_PATH="${{ env.PROJECT_ROOT }}/debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists at $KEYSTORE_PATH."
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x "${{ env.PROJECT_ROOT }}/gradlew"

      - name: Build Debug APK
        run: |
          cd "${{ env.PROJECT_ROOT }}"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Verify Generated APK
        id: verify-apk
        run: |
          # Look for debug APK files in the module's build output folder
          APK_DIR="${{ env.PROJECT_ROOT }}/${{ env.APP_MODULE }}/build/outputs/apk/debug"
          echo "Searching for debug APK files in $APK_DIR..."

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Build folder for debug APKs does not exist: $APK_DIR"
            exit 1
          fi

          # Find APK files
          APK_FILES=$(find "$APK_DIR" -name "*.apk" -print)
          if [ -z "$APK_FILES" ]; then
            echo "::error::No APK file was found in $APK_DIR!"
            exit 1
          fi

          echo "Successfully verified generated APK(s):"
          echo "$APK_FILES"

          # Save the APK directory path for upload
          echo "APK_DIR=$APK_DIR" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error
